<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Metadata Generator Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b111e;
            color: #e2e8f0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 290px;
            background-color: #0f172a;
            border-right: 1px solid #1e293b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-shrink: 0;
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 15px;
            border-bottom: 1px solid #1e293b;
        }

        .profile-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #1e293b;
            border: 2px solid #38bdf8;
            object-fit: cover;
        }

        .profile-info h3 {
            font-size: 14px;
            color: #fff;
        }

        .profile-info p {
            font-size: 11px;
            color: #38bdf8;
        }

        .menu-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-top: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-item label {
            font-size: 13px;
            color: #94a3b8;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex: 1;
            accent-color: #38bdf8;
        }

        .range-val {
            font-size: 12px;
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            min-width: 25px;
            text-align: center;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0b111e;
            overflow-y: auto;
        }

        .navbar {
            height: 65px;
            background-color: #0f172a;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            flex-shrink: 0;
        }

        .nav-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .nav-btn-group {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            border: none;
            font-weight: 500;
        }

        .btn-premium { background: #eab308; color: #0f172a; font-weight: bold; }

        .dashboard-body {
            padding: 30px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .platforms-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            background: #0f172a;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #1e293b;
        }

        .platform-tab {
            padding: 8px 16px;
            border-radius: 8px;
            background: transparent;
            border: 1px solid transparent;
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
        }

        .platform-tab.active {
            background: #1e293b;
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .workspace-grid { grid-template-columns: 1fr; }
        }

        .card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 25px;
        }

        .upload-box {
            border: 2px dashed #1e293b;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #111a2e;
            margin-bottom: 20px;
        }

        .upload-box.dragover {
            border-color: #38bdf8;
            background: #1e293b;
        }

        .upload-icon {
            font-size: 40px;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            background: #0b111e;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 14px;
        }

        .btn-ai-generate {
            width: 100%;
            background: linear-gradient(135deg, #a855f7, #38bdf8);
            color: white;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .action-btns { display: flex; gap: 10px; }
        .btn-primary {
            flex: 1; background: #38bdf8; color: #0f172a; padding: 12px;
            border-radius: 8px; border: none; font-weight: bold; cursor: pointer;
        }
        .btn-secondary {
            flex: 1; background: #1e293b; color: white; padding: 12px;
            border-radius: 8px; border: 1px solid #334155; cursor: pointer; text-align: center;
        }

        #result {
            background: #0b111e; border: 1px solid #1e293b; border-radius: 8px;
            padding: 15px; min-height: 340px; white-space: pre-wrap;
            font-family: monospace; font-size: 13px; color: #cbd5e1; overflow-y: auto;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: none;
            justify-content: center; align-items: center; z-index: 9999;
        }

        .modal-card {
            background: #0f172a; border: 2px solid #eab308; width: 95%;
            max-width: 500px; border-radius: 16px; padding: 25px; text-align: center; position: relative;
        }

        .pricing-tier-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0;
        }

        .price-box {
            background: #111a2e; border: 1px solid #1e293b; padding: 15px; border-radius: 10px; cursor: pointer;
        }

        .price-box.selected { border-color: #eab308; background: #1e293b; }
        .price-box h4 { font-size: 16px; color: #fff; }
        .price-box p { font-size: 20px; color: #eab308; font-weight: bold; margin: 5px 0; }
        .price-box span { font-size: 11px; color: #64748b; }

        .payment-instructions {
            background: #1e293b; padding: 15px; border-radius: 10px; text-align: left; font-size: 13px; margin-bottom: 15px;
        }

        .close-modal {
            position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: #64748b; font-size: 22px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="profile-section">
            <img src="logo.png" alt="Logo" class="profile-img" onerror="this.src='https://flaticon.com'">
            <div class="profile-info">
                <h3>Metadata Pro</h3>
                <p>Premium Generator</p>
            </div>
        </div>
        
        <div class="menu-title">Adjustments</div>
        <div class="control-group">
            <div class="control-item">
                <label>Keywords Target</label>
                <div class="slider-container">
                    <input type="range" min="10" max="50" value="35">
                    <span class="range-val">35</span>
                </div>
            </div>
        </div>
        <p style="font-size: 12px; color: #10b981; margin-top: auto;">● AI Engine Live & Active</p>
    </div>

    <div class="main-content">
        <div class="navbar">
            <div class="nav-title">AI Core Workspace</div>
            <div class="nav-btn-group">
                <button class="nav-btn btn-premium" onclick="showPaywall()">View Pricing Plans</button>
            </div>
        </div>

        <div class="dashboard-body">
            <div class="platforms-container">
                <button class="platform-tab active" onclick="selectPlatform(this, 'Adobe Stock')">Adobe Stock</button>
                <button class="platform-tab" onclick="selectPlatform(this, 'Shutterstock')">Shutterstock</button>
                <button class="platform-tab" onclick="selectPlatform(this, 'Vecteezy')">Vecteezy</button>
            </div>
